name: 'Pack and Publish .NET NuGet Package for .net8.0' 
description: 'Restores, builds, packs, and publishes a .NET NuGet package to GitHub Packages'
inputs:
  dotnet-version:
    description: 'Version of .NET to use'
    required: false
    default: '8.0.x'
  gh-packages-token:
    description: 'GitHub Packages token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages        # Try to find if a build cached packages. Maybe the build_check. This saves time
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Cache build output      # Try to find if a build cached comiled files. Maybe the build_check. This saves time
      uses: actions/cache@v4
      with:
        path: |
          **/bin
          **/obj
        key: build-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          build-${{ runner.os }}-

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.1.0
      with:
        versionSpec: '6.4.0'

    - name: Run GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.1.0
      with:
        overrideConfig: |
          workflow=TrunkBased/preview1
          commit-message-incrementing=Enabled
          tag-prefix=v
          increment=Patch

    - name: Show extracted version
      run: echo "Version is ${{ steps.gitversion.outputs.SemVer }}"
      shell: bash

    - name: Restore dependencies
      run: dotnet restore
      shell: bash

    - name: Build
      run: dotnet build --configuration Release
      shell: bash

    - name: Pack NuGet package
      run: dotnet pack --configuration Release --output ./nuget /p:PackageVersion=${{ steps.gitversion.outputs.SemVer }}
      shell: bash

    - name: Publish to GitHub Packages
      run: dotnet nuget push ./nuget/*.symbols.nupkg --source "https://nuget.pkg.github.com/Official-EwE/index.json" --api-key "${{ secrets.GH_PACKAGES_TOKEN }}" --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      shell: bash
